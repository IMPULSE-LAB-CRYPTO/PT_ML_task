version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # сохраняем результаты и базу данных
    
  ui:
    build: .
    command: streamlit run src/ui.py --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api